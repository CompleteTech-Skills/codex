[package]
name = "codex-storage-migration"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
codex-postgres-runtime = { workspace = true }
codex-protocol = { workspace = true }
codex-state = { workspace = true }
codex-storage-authority = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "sqlite"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
uuid = { workspace = true, features = ["v4", "v7"] }

[dev-dependencies]
codex-postgres-log-store = { workspace = true }
codex-postgres-queue-store = { workspace = true }
codex-postgres-rollout-store = { workspace = true }
codex-postgres-thread-catalog = { workspace = true }
codex-thread-store = { workspace = true }
codex-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
