[package]
name = "codex-remote-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
codex-agent-graph-store = { workspace = true }
codex-agent-message-board-extension = { workspace = true }
codex-keyring-store = { workspace = true }
codex-postgres-goal-store = { workspace = true }
codex-postgres-import-store = { workspace = true }
codex-postgres-log-store = { workspace = true }
codex-postgres-memory-store = { workspace = true }
codex-postgres-message-board = { workspace = true }
codex-postgres-queue-store = { workspace = true }
codex-postgres-runtime = { workspace = true }
codex-postgres-thread-catalog = { workspace = true }
codex-postgres-thread-store = { workspace = true }
codex-protocol = { workspace = true }
codex-storage-authority = { workspace = true }
sqlx = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["rt", "sync"] }
uuid = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
codex-state = { workspace = true }
codex-thread-store = { workspace = true }
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
