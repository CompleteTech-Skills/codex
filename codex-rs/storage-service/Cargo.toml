[package]
name = "codex-storage-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
codex-keyring-store = { workspace = true }
codex-postgres-runtime = { workspace = true }
codex-remote-storage = { workspace = true }
codex-state = { workspace = true }
codex-storage-authority = { workspace = true }
codex-storage-migration = { workspace = true }
codex-utils-absolute-path = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "sqlite"] }
tokio = { workspace = true, features = ["fs", "time"] }
uuid = { workspace = true, features = ["serde", "v4", "v7"] }

[dev-dependencies]
codex-protocol = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
