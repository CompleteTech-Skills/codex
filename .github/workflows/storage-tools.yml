name: Storage tools

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: Real PostgreSQL qualification (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: hashFiles('scripts/postgres/integration.py') != ''
        with:
          python-version: "3.14"

      - name: Qualify TLS, roles, restart, backup, and restore with Docker
        if: hashFiles('scripts/postgres/integration.py') != ''
        run: >-
          python scripts/postgres/integration.py
          --root "$RUNNER_TEMP/codex-pg-qualification"
          --port-base 56071

      # The report contains outcomes and resource names only. Never upload the
      # state root: it also holds private keys, passwords, and database backups.
      - name: Upload qualification report
        if: always() && hashFiles('scripts/postgres/integration.py') != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: postgres-linux-qualification
          path: ${{ runner.temp }}/codex-pg-qualification/qualification.json
          if-no-files-found: ignore
          retention-days: 7

  postgres-rust-pool:
    name: PostgreSQL Rust pool (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just
          version: 1.58.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103
      - name: Start isolated PostgreSQL fixture
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/codex-pg-rust-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'CODEX_TEST_POSTGRES_STATE=%s\n' "$state" >> "$GITHUB_ENV"
          python scripts/postgres/manage.py --state "$state" init --project "codex-pg-rust-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --port 56081
          python scripts/postgres/manage.py --state "$state" pin
          python scripts/postgres/manage.py --state "$state" up
      - name: Provision PostgreSQL integration-test role graph
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts/postgres")
          from qualification_checks import sql

          state = Path(os.environ["CODEX_TEST_POSTGRES_STATE"])
          sql(state, Path("scripts/postgres/container/real-bootstrap-test-roles.sql").read_text())
          PY
      - name: Test PostgreSQL connection pool against real server
        working-directory: codex-rs
        run: just test -p codex-postgres-runtime
      - name: Require the real default namespace bootstrap fixture
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          : "${CODEX_TEST_POSTGRES_STATE:?owned bootstrap fixture state is required}"
          CODEX_TEST_POSTGRES_REQUIRED=1 just test --locked -p codex-postgres-runtime real_postgres_bootstrap_is_atomic_role_scoped_and_idempotent --retries 0
      - name: Verify bootstrap and preflight serialize with restore
        working-directory: codex-rs
        run: CODEX_TEST_POSTGRES_LOCK_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-postgres-runtime real_restore_lock_serializes_bootstrap_and_preflight
      - name: Reset bootstrapped metadata before seeding the restore fixture
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts/postgres")
          from qualification_checks import sql

          # The Rust bootstrap suite leaves a bootstrapped namespace; seeding needs it empty.
          sql(
              Path(os.environ["CODEX_TEST_POSTGRES_STATE"]),
              """DO $reset$ DECLARE r record; BEGIN
              FOR r IN SELECT c.relname FROM pg_class c
                       WHERE c.relnamespace = 'codex_storage'::regnamespace AND c.relkind IN ('r', 'p') LOOP
                EXECUTE format('DROP TABLE codex_storage.%I CASCADE', r.relname);
              END LOOP; END $reset$""",
          )
          PY
      - name: Seed owned restore metadata fixture without production bootstrap
        shell: bash
        run: python scripts/postgres/tests/seed_restore_metadata.py --state "$CODEX_TEST_POSTGRES_STATE" --owned-disposable
      - name: Verify archive cleanup after uncertain source mutations
        run: python -m unittest discover -s scripts/postgres/tests -p test_restore_archive_cleanup_live.py -v
      - name: Qualify transactional restore guard
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/codex-pg-focused-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'CODEX_TEST_POSTGRES_FOCUSED_RESTORE_STATE=%s\n' "$state" >> "$GITHUB_ENV"
          python scripts/postgres/manage.py --state "$state" init --project "codex-pg-focused-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --port 16481
          python scripts/postgres/manage.py --state "$state" pin
          CODEX_TEST_POSTGRES_FOCUSED_RESTORE_STATE="$state" python -m unittest discover -s scripts/postgres/tests -p test_restore_access_live.py -v
          CODEX_TEST_POSTGRES_FOCUSED_RESTORE_STATE="$state" python -m unittest discover -s scripts/postgres/tests -p test_restore_indirect_access_live.py -v
          CODEX_TEST_POSTGRES_FOCUSED_RESTORE_STATE="$state" python -m unittest discover -s scripts/postgres/tests -p test_restore_routine_access_live.py -v
          CODEX_TEST_POSTGRES_FOCUSED_RESTORE_STATE="$state" python -m unittest discover -s scripts/postgres/tests -p test_restore_transitive_definers_live.py -v
      - name: Qualify restore ACLs and fixture cleanup
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/codex-pg-rust-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'CODEX_TEST_POSTGRES_RESTORE_STATE=%s\n' "$state" >> "$GITHUB_ENV"
          python scripts/postgres/manage.py --state "$state" init --project "codex-pg-rust-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --port 16482
          python scripts/postgres/manage.py --state "$state" pin
          python scripts/postgres/manage.py --state "$state" up
          CODEX_TEST_POSTGRES_RESTORE_STATE="$state" python -m unittest discover -s scripts/postgres/tests -p test_restore_qualification_cleanup_live.py -v
          RESTORE_STATE="$state" python - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts/postgres")
          from restore_qualification import qualify_restore_access
          qualify_restore_access(Path(os.environ["CODEX_TEST_POSTGRES_STATE"]), Path(os.environ["RESTORE_STATE"]))
          PY
      - name: Provision integration-test roles on the restored PostgreSQL fixture
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts/postgres")
          from qualification_checks import sql

          state = Path(os.environ["CODEX_TEST_POSTGRES_RESTORE_STATE"])
          sql(state, Path("scripts/postgres/container/real-bootstrap-test-roles.sql").read_text())
          PY
      - name: Require real bootstrap against restored PostgreSQL metadata
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          : "${CODEX_TEST_POSTGRES_RESTORE_STATE:?owned restored fixture state is required}"
          CODEX_TEST_POSTGRES_STATE="$CODEX_TEST_POSTGRES_RESTORE_STATE" CODEX_TEST_POSTGRES_REQUIRED=1 just test --locked -p codex-postgres-runtime real_postgres_bootstrap_is_atomic_role_scoped_and_idempotent --retries 0
      - name: Test serializable transaction outcomes against real server
        working-directory: codex-rs
        run: CODEX_TEST_POSTGRES_TRANSACTION_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-postgres-runtime real_serializable_conflict_deadlock_and_cancelled_write
      - name: Test inactive thread ownership against real server
        working-directory: codex-rs
        run: CODEX_TEST_POSTGRES_OWNERSHIP_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-postgres-runtime real_two_clients_reject_stale_thread_owners
      - name: Provision separate namespace roles in fixture
        run: python scripts/postgres/isolation_fixture.py --state "$CODEX_TEST_POSTGRES_STATE"
      - name: Test named namespace bootstrap against real server
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          : "${CODEX_TEST_POSTGRES_STATE:?owned named bootstrap fixture state is required}"
          CODEX_TEST_POSTGRES_ISOLATION_REQUIRED=1 CODEX_TEST_POSTGRES_ISOLATION_STATE="$CODEX_TEST_POSTGRES_STATE" just test --locked -p codex-postgres-runtime real_named_namespace_bootstrap_is_isolated_and_rejects_wrong_roles --retries 0
      - name: Test named thread ownership against real server
        working-directory: codex-rs
        run: CODEX_TEST_POSTGRES_ISOLATION_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-postgres-runtime real_named_thread_ownership_is_namespace_scoped
      - name: Test PostgreSQL graph adapter and role isolation
        working-directory: codex-rs
        run: CODEX_TEST_POSTGRES_GRAPH_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-agent-graph-store real_postgres_graph_adapter_preserves_order_and_edge_semantics
      - name: Compare external-agent import records across SQLite and PostgreSQL
        working-directory: codex-rs
        run: CODEX_TEST_POSTGRES_IMPORT_STORE_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-postgres-import-store real_postgres_import_records_match_sqlite
      - name: Compare goal persistence across SQLite and PostgreSQL
        working-directory: codex-rs
        run: CODEX_TEST_POSTGRES_GOAL_STORE_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-postgres-goal-store real_postgres_goals_match_sqlite
      - name: Compare queue persistence across SQLite and PostgreSQL
        working-directory: codex-rs
        run: CODEX_TEST_POSTGRES_QUEUE_STORE_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-postgres-queue-store real_postgres_queue
      - name: Compare log persistence across SQLite and PostgreSQL
        working-directory: codex-rs
        run: CODEX_TEST_POSTGRES_LOG_STORE_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-postgres-log-store real_postgres_logs
      - name: Compare memory persistence across SQLite and PostgreSQL
        working-directory: codex-rs
        run: CODEX_TEST_POSTGRES_MEMORY_STORE_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-postgres-memory-store real_postgres_memory
      - name: Compare message board persistence across SQLite and PostgreSQL
        working-directory: codex-rs
        run: CODEX_TEST_POSTGRES_MESSAGE_BOARD_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-postgres-message-board real_postgres_board
      - name: Compare thread catalog persistence across SQLite and PostgreSQL
        working-directory: codex-rs
        run: CODEX_TEST_POSTGRES_THREAD_CATALOG_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-postgres-thread-catalog real_postgres_thread_catalog
      - name: Test canonical rollout storage against real server
        working-directory: codex-rs
        run: CODEX_TEST_POSTGRES_ROLLOUT_STORE_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-postgres-rollout-store real_postgres_rollouts
      - name: Compare thread store behavior across SQLite and PostgreSQL
        working-directory: codex-rs
        run: CODEX_TEST_POSTGRES_THREAD_STORE_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-postgres-thread-store real_postgres_thread_store
      - name: Migrate a SQLite catalog into PostgreSQL and verify it
        working-directory: codex-rs
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "../scripts/postgres")
          from qualification_checks import sql

          # Earlier steps leave project keys behind and the runtime role cannot delete them.
          sql(Path(os.environ["CODEX_TEST_POSTGRES_STATE"]), "TRUNCATE codex_storage.project_idempotency_keys, codex_storage.queued_thread_revisions, codex_storage.agent_board_deleted, codex_storage.external_agent_config_imports, codex_storage.threads, codex_storage.projects CASCADE")
          PY
          CODEX_TEST_POSTGRES_REQUIRED=1 CODEX_TEST_POSTGRES_MIGRATION_STATE="$CODEX_TEST_POSTGRES_STATE" just test --locked -p codex-storage-migration real_postgres_catalog_migration --retries 0
      - name: Connect through a storage profile in the default and a named namespace
        working-directory: codex-rs
        run: CODEX_TEST_POSTGRES_REMOTE_STORAGE_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-remote-storage real_postgres_remote_storage
      - name: Select remote storage after a verified cutover
        working-directory: codex-rs
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "../scripts/postgres")
          from qualification_checks import sql

          sql(Path(os.environ["CODEX_TEST_POSTGRES_STATE"]), "TRUNCATE codex_storage.project_idempotency_keys, codex_storage.queued_thread_revisions, codex_storage.agent_board_deleted, codex_storage.external_agent_config_imports, codex_storage.threads, codex_storage.projects CASCADE")
          PY
          CODEX_TEST_POSTGRES_REMOTE_BACKEND_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-remote-backend real_postgres_remote_backend_selection
      - name: Plan, migrate, activate and return through the storage service
        working-directory: codex-rs
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "../scripts/postgres")
          from qualification_checks import sql

          sql(Path(os.environ["CODEX_TEST_POSTGRES_STATE"]), "TRUNCATE codex_storage.project_idempotency_keys, codex_storage.queued_thread_revisions, codex_storage.agent_board_deleted, codex_storage.external_agent_config_imports, codex_storage.threads, codex_storage.projects CASCADE")
          PY
          CODEX_TEST_POSTGRES_STORAGE_SERVICE_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-storage-service real_postgres_storage_service
      - name: Serve threads from PostgreSQL through a real app-server
        working-directory: codex-rs
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "../scripts/postgres")
          from qualification_checks import sql

          sql(Path(os.environ["CODEX_TEST_POSTGRES_STATE"]), "TRUNCATE codex_storage.project_idempotency_keys, codex_storage.queued_thread_revisions, codex_storage.agent_board_deleted, codex_storage.external_agent_config_imports, codex_storage.threads, codex_storage.projects CASCADE")
          PY
          CODEX_TEST_POSTGRES_APP_SERVER_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-app-server app_server_serves_threads_from_postgres_without_local_history
      - name: Test two-namespace role isolation against real server
        working-directory: codex-rs
        run: CODEX_TEST_POSTGRES_ISOLATION_STATE="$CODEX_TEST_POSTGRES_STATE" just test -p codex-postgres-runtime real_postgres_roles_isolate_two_schemas
      - name: Test bounded restart and loopback network interruption
        working-directory: codex-rs
        run: CODEX_TEST_POSTGRES_INTERRUPTION_STATE="$CODEX_TEST_POSTGRES_STATE" CODEX_TEST_POSTGRES_MANAGER="$GITHUB_WORKSPACE/scripts/postgres/manage.py" just test -p codex-postgres-runtime real_restart_and_loopback_network_cut_are_bounded
      - name: Stop fixture and retain receipts
        if: always()
        shell: bash
        run: |
          cleanup_status=0
          for state in "${CODEX_TEST_POSTGRES_STATE:-}" "${CODEX_TEST_POSTGRES_FOCUSED_RESTORE_STATE:-}" "${CODEX_TEST_POSTGRES_RESTORE_STATE:-}"; do
            if [[ -n "$state" && -f "$state/receipt.json" ]]; then
              python scripts/postgres/manage.py --state "$state" down || cleanup_status=1
            fi
          done
          exit "$cleanup_status"
      - name: Start isolated v1 to v2 upgrade fixture
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/codex-pg-upgrade-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'CODEX_TEST_POSTGRES_UPGRADE_STATE=%s\n' "$state" >> "$GITHUB_ENV"
          python scripts/postgres/manage.py --state "$state" init --project "codex-pg-upgrade-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --port 56082
          python scripts/postgres/manage.py --state "$state" pin
          python scripts/postgres/manage.py --state "$state" up
      - name: Test PostgreSQL v1 through v3 transactional upgrade
        working-directory: codex-rs
        run: just test -p codex-postgres-runtime real_v1_upgrade_through_graph_and_import_schemas_is_atomic
      - name: Stop upgrade fixture and retain receipts
        if: always()
        shell: bash
        run: |
          if [[ -n "${CODEX_TEST_POSTGRES_UPGRADE_STATE:-}" && -f "$CODEX_TEST_POSTGRES_UPGRADE_STATE/receipt.json" ]]; then
            python scripts/postgres/manage.py --state "$CODEX_TEST_POSTGRES_UPGRADE_STATE" down
          fi
      - name: Start isolated v2 to v3 upgrade fixture
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/codex-pg-import-upgrade-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'CODEX_TEST_POSTGRES_IMPORT_UPGRADE_STATE=%s\n' "$state" >> "$GITHUB_ENV"
          python scripts/postgres/manage.py --state "$state" init --project "codex-pg-import-upgrade-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --port 56084
          python scripts/postgres/manage.py --state "$state" pin
          python scripts/postgres/manage.py --state "$state" up
      - name: Test PostgreSQL v2 to v3 transactional upgrade
        working-directory: codex-rs
        run: just test -p codex-postgres-runtime real_v2_upgrade_to_import_schema_is_atomic_and_role_scoped
      - name: Stop import upgrade fixture and retain receipts
        if: always()
        shell: bash
        run: |
          if [[ -n "${CODEX_TEST_POSTGRES_IMPORT_UPGRADE_STATE:-}" && -f "$CODEX_TEST_POSTGRES_IMPORT_UPGRADE_STATE/receipt.json" ]]; then
            python scripts/postgres/manage.py --state "$CODEX_TEST_POSTGRES_IMPORT_UPGRADE_STATE" down
          fi
      - name: Start isolated v3 to v4 thread upgrade fixture
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/codex-pg-thread-upgrade-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'CODEX_TEST_POSTGRES_THREAD_UPGRADE_STATE=%s\n' "$state" >> "$GITHUB_ENV"
          python scripts/postgres/manage.py --state "$state" init --project "codex-pg-thread-upgrade-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --port 56085
          python scripts/postgres/manage.py --state "$state" pin
          python scripts/postgres/manage.py --state "$state" up
      - name: Test PostgreSQL v3 to v4 transactional thread upgrade
        working-directory: codex-rs
        run: just test -p codex-postgres-runtime real_v3_upgrade_to_thread_schema_preserves_history_and_origin_paths
      - name: Stop thread upgrade fixture and retain receipts
        if: always()
        shell: bash
        run: |
          if [[ -n "${CODEX_TEST_POSTGRES_THREAD_UPGRADE_STATE:-}" && -f "$CODEX_TEST_POSTGRES_THREAD_UPGRADE_STATE/receipt.json" ]]; then
            python scripts/postgres/manage.py --state "$CODEX_TEST_POSTGRES_THREAD_UPGRADE_STATE" down
          fi
      - name: Start isolated v4 to v5 section upgrade fixture
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/codex-pg-section-upgrade-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'CODEX_TEST_POSTGRES_SECTION_UPGRADE_STATE=%s\n' "$state" >> "$GITHUB_ENV"
          python scripts/postgres/manage.py --state "$state" init --project "codex-pg-section-upgrade-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --port 56086
          python scripts/postgres/manage.py --state "$state" pin
          python scripts/postgres/manage.py --state "$state" up
      - name: Test PostgreSQL v4 to v5 transactional section upgrade
        working-directory: codex-rs
        run: just test -p codex-postgres-runtime real_v4_upgrade_to_section_catalog_rejects_orphans_and_preserves_join
      - name: Provision isolated named schema for v4 to v5 upgrade
        run: python scripts/postgres/isolation_fixture.py --state "$CODEX_TEST_POSTGRES_SECTION_UPGRADE_STATE"
      - name: Test named PostgreSQL v4 to v5 transactional section upgrade
        working-directory: codex-rs
        run: just test -p codex-postgres-runtime real_named_v4_upgrade_to_section_catalog_is_atomic
      - name: Stop section upgrade fixture and retain receipts
        if: always()
        shell: bash
        run: |
          if [[ -n "${CODEX_TEST_POSTGRES_SECTION_UPGRADE_STATE:-}" && -f "$CODEX_TEST_POSTGRES_SECTION_UPGRADE_STATE/receipt.json" ]]; then
            python scripts/postgres/manage.py --state "$CODEX_TEST_POSTGRES_SECTION_UPGRADE_STATE" down
          fi

  offline:
    name: Offline tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Find Git OpenSSL on Windows
        if: runner.os == 'Windows' && hashFiles('scripts/postgres/**/*.py') != ''
        shell: pwsh
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command git).Source)
          $openssl = Join-Path $gitRoot 'usr/bin/openssl.exe'
          if (!(Test-Path -LiteralPath $openssl)) {
            throw 'Git OpenSSL is required for the storage state tests'
          }
          Split-Path $openssl | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify OpenSSL
        if: hashFiles('scripts/postgres/**/*.py') != ''
        run: openssl version

      - name: Test offline storage contracts
        if: hashFiles('scripts/storage_contract/**/*.py') != ''
        run: python -m unittest discover -s scripts/storage_contract -t scripts -v

      - name: Test PostgreSQL management helpers without Docker
        if: hashFiles('scripts/postgres/**/*.py') != ''
        run: python -m unittest discover -s scripts/postgres/tests -v

      - name: Check PostgreSQL shell syntax
        if: hashFiles('scripts/postgres/container/*.sh') != ''
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/postgres/container/*.sh; do
            bash -n "$script"
          done

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  workflows:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install checksum-pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint-bin"
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" --directory "$install_dir" actionlint
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Check storage workflow definitions
        run: >-
          actionlint -color -shellcheck=""
          .github/workflows/blocking-ci.yml
          .github/workflows/postmerge-ci.yml
          .github/workflows/storage-tools.yml
          .github/workflows/v8-canary.yml
      - name: Test check selection
        run: python3 -m unittest discover -s .github/scripts -p test_storage_ci_paths.py -v
